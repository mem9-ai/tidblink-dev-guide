<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" role="img" aria-label="TiDB Link 简化架构图"><style>
svg{--dev:#eef2f7;--devs:#64748b;--api:#fff7e6;--apis:#d97706;--org:#f3effd;--orgs:#7c3aed;--usr:#e8f6f3;--usrs:#0f766e;--run:#eef3fb;--runs:#2563eb}
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2937}
.h{font-size:15px;font-weight:700}.t{font-size:14px;font-weight:700}.s{font-size:12.5px;fill:#374151}.m{font-size:11.5px;fill:#6b7280}
.c{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}.l{font-size:11.5px;font-weight:600}
</style><rect width="100%" height="100%" fill="#ffffff"/>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#64748b"/></marker>
<marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#7c3aed"/></marker>
<marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#db2777"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker>
</defs>
<text x="20" y="34" class="h">Your system</text>
<text x="340" y="34" class="h">TiDB Link API (by credential)</text>
<text x="660" y="34" class="h">TiDB Link platform</text>

<!-- col A -->
<rect x="20" y="55" width="260" height="85" rx="10" fill="#fff" stroke="var(--devs)" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="36" y="82" class="t">Console (manual)</text>
<text x="36" y="106" class="s">Org Owner issues the Org API Key</text>
<text x="36" y="126" class="m">Setup only; not part of the API integration</text>

<rect x="20" y="180" width="260" height="190" rx="10" fill="var(--dev)" stroke="var(--devs)" stroke-width="1.5"/>
<text x="36" y="207" class="t">Customer backend</text>
<text x="36" y="233" class="s">• Holds the Org Key and each User Key</text>
<text x="36" y="257" class="s">• Maps your user ↔ userId</text>
<text x="36" y="281" class="s">• Sends messages, relays SSE to clients</text>
<text x="36" y="305" class="s">• Obtains connectTokens for voice</text>
<text x="36" y="329" class="s">• Records sessionId ↔ your user</text>
<text x="36" y="352" class="m">All long-lived keys stay here</text>

<rect x="20" y="400" width="260" height="130" rx="10" fill="var(--dev)" stroke="var(--devs)" stroke-width="1.5"/>
<text x="36" y="427" class="t">Client (browser / app / device)</text>
<text x="36" y="453" class="s">• Holds no API key</text>
<text x="36" y="477" class="s">• Text: through your backend</text>
<text x="36" y="501" class="s">• Voice: WS with a connectToken</text>

<!-- col B -->
<rect x="340" y="55" width="260" height="85" rx="10" fill="var(--api)" stroke="var(--apis)" stroke-width="1.5"/>
<text x="356" y="80" class="c" style="font-weight:700">/api/v1/org/**</text>
<text x="356" y="102" class="l" style="fill:#b45309">Organization API Key</text>
<text x="356" y="124" class="s">Templates, End Users, User Keys</text>

<rect x="340" y="180" width="260" height="190" rx="10" fill="var(--api)" stroke="var(--apis)" stroke-width="1.5"/>
<text x="356" y="205" class="c" style="font-weight:700">/api/v1/user/**</text>
<text x="356" y="227" class="l" style="fill:#b45309">User API Key (one End User)</text>
<text x="356" y="253" class="s">Create Agents and Sessions</text>
<text x="356" y="277" class="s">POST …/events → receipt</text>
<text x="356" y="301" class="s">GET …/events → SSE stream</text>
<text x="356" y="325" class="s">POST …/realtime → connectToken</text>
<text x="356" y="349" class="s">Register / activate Connectors</text>

<rect x="340" y="400" width="260" height="130" rx="10" fill="var(--api)" stroke="var(--apis)" stroke-width="1.5"/>
<text x="356" y="427" class="t">Realtime WebSocket</text>
<text x="356" y="451" class="c">tidb-link.realtime.v1</text>
<text x="356" y="477" class="s">First frame: session.connect</text>
<text x="356" y="501" class="s">Audio frames, transcripts, barge-in</text>

<!-- col C -->
<rect x="660" y="48" width="525" height="672" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="675" y="62" width="495" height="80" rx="10" fill="var(--org)" stroke="var(--orgs)" stroke-width="1.5"/>
<text x="691" y="88" class="t">Agent Template (Organization-shared)</text>
<text x="691" y="112" class="s">instructions · Sandbox · Skills · realtime language · referenced Connectors</text>
<text x="691" y="132" class="m">Saves apply immediately, but only to Sessions created afterwards</text>

<g>
<rect x="675" y="200" width="105" height="90" rx="10" fill="var(--usr)" stroke="var(--usrs)" stroke-width="1.5"/>
<text x="689" y="226" class="t">End User</text><text x="689" y="250" class="c">userId</text><text x="689" y="272" class="m">your user</text>
<rect x="800" y="200" width="110" height="90" rx="10" fill="var(--usr)" stroke="var(--usrs)" stroke-width="1.5"/>
<text x="814" y="226" class="t">Agent</text><text x="814" y="250" class="s">user×Template</text><text x="814" y="272" class="m">association</text>
<rect x="930" y="200" width="120" height="90" rx="10" fill="var(--usr)" stroke="var(--usrs)" stroke-width="1.5"/>
<text x="944" y="226" class="t">Session</text><text x="944" y="250" class="s">freezes Template</text><text x="944" y="272" class="m">text + voice</text>
<rect x="1070" y="200" width="100" height="90" rx="10" fill="var(--usr)" stroke="var(--usrs)" stroke-width="1.5"/>
<text x="1084" y="226" class="t">Turn</text><text x="1084" y="250" class="s">one run</text><text x="1084" y="272" class="m">events → SSE</text>
</g>
<path d="M780,245 H798" stroke="#0f766e" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M910,245 H928" stroke="#0f766e" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M1050,245 H1068" stroke="#0f766e" stroke-width="1.8" marker-end="url(#a)"/>
<text x="675" y="190" class="m" style="fill:#0f766e">End User private resources</text>

<rect x="675" y="400" width="215" height="130" rx="10" fill="var(--run)" stroke="var(--runs)" stroke-width="1.5"/>
<text x="691" y="427" class="t">Realtime Connection</text>
<text x="691" y="451" class="s">Attached to an existing Session</text>
<text x="691" y="475" class="s">Realtime Model listens &amp; speaks</text>
<text x="691" y="499" class="s">Transcripts → Session timeline</text>

<rect x="950" y="400" width="220" height="130" rx="10" fill="var(--run)" stroke="var(--runs)" stroke-width="1.5"/>
<text x="966" y="427" class="t">Full Agent (LLM)</text>
<text x="966" y="451" class="s">Runs the Session’s frozen recipe</text>
<text x="966" y="475" class="s">Calls tools, incl. Connector tools</text>
<text x="966" y="499" class="s">Every execution is a Turn</text>

<!-- arrows col A -->
<path d="M150,140 V178" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#p)"/>
<text x="158" y="164" class="m" style="fill:#7c3aed">Org Key</text>
<path d="M150,400 V372" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="158" y="390" class="m">text / connectToken</text>
<path d="M280,110 C310,110 310,98 338,98" stroke="#64748b" stroke-width="0" fill="none"/>
<path d="M280,215 C310,215 312,98 338,98" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M280,275 H338" stroke="#64748b" stroke-width="1.8" marker-start="url(#a)" marker-end="url(#a)"/>
<path d="M280,465 H338" stroke="#2563eb" stroke-width="1.8" marker-start="url(#b)" marker-end="url(#b)"/>
<text x="290" y="456" class="m" style="fill:#2563eb">voice</text>

<!-- B -> C -->
<path d="M600,98 H673" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M600,125 C650,125 640,245 673,245" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>

<path d="M600,230 H640 V168 H855 V198" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<text x="700" y="162" class="m">create Agent / Session, send, subscribe</text>
<path d="M600,465 H673" stroke="#2563eb" stroke-width="1.8" marker-start="url(#b)" marker-end="url(#b)"/>

<!-- internal -->
<path d="M1000,142 V198" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#p)"/>
<text x="1008" y="178" class="m" style="fill:#7c3aed">frozen at creation</text>
<path d="M960,290 V340 H790 V398" stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#b)"/>
<text x="800" y="334" class="m" style="fill:#2563eb">open voice</text>
<path d="M1010,290 V398" stroke="#2563eb" stroke-width="1.6" marker-end="url(#b)"/>
<text x="1016" y="350" class="m" style="fill:#2563eb">message</text>
<path d="M890,465 H948" stroke="#2563eb" stroke-width="1.8" marker-end="url(#b)"/>
<text x="896" y="455" class="m" style="fill:#2563eb">delegate</text>
<path d="M1120,400 V292" stroke="#2563eb" stroke-width="1.6" marker-end="url(#b)"/>
<text x="1126" y="350" class="m" style="fill:#2563eb">produces</text>

<!-- device via connector row -->
<rect x="20" y="575" width="260" height="130" rx="10" fill="var(--dev)" stroke="var(--devs)" stroke-width="1.5"/>
<text x="36" y="600" class="t">Your device server (Connector)</text>
<text x="36" y="624" class="s">• MCP server with the Connector Key</text>
<text x="36" y="646" class="s">• Maps sessionId → user → device</text>
<text x="36" y="668" class="s">• Dedupes by callId; answers by deadline</text>
<text x="36" y="690" class="m">May be the same service as your backend</text>

<rect x="20" y="745" width="260" height="80" rx="10" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5"/>
<text x="36" y="770" class="t">Hardware devices</text>
<text x="36" y="793" class="s">• Use your own protocol (MQTT/WS…)</text>
<text x="36" y="814" class="s">• Never talk to TiDB Link directly</text>
<path d="M150,745 V707" stroke="#db2777" stroke-width="1.8" marker-start="url(#h)" marker-end="url(#h)"/>
<text x="158" y="731" class="m" style="fill:#db2777">your protocol</text>

<rect x="340" y="575" width="260" height="130" rx="10" fill="var(--api)" stroke="var(--apis)" stroke-width="1.5"/>
<text x="356" y="600" class="t">Connector transport</text>
<text x="356" y="624" class="s">streamable_http → your HTTPS</text>
<text x="356" y="646" class="s">tunnel: you dial in (no public IP)</text>
<text x="356" y="666" class="c">/api/v1/connectors/ws</text>
<text x="356" y="690" class="l" style="fill:#b45309">Bearer connectorKey</text>

<rect x="675" y="575" width="495" height="130" rx="10" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5"/>
<text x="691" y="600" class="t">Connector (developer-hosted tool)</text>
<text x="691" y="624" class="s">Register → activate: tool catalog discovered and frozen; Templates reference it</text>
<text x="691" y="646" class="s">Every call carries Call Context: callId · sessionId · organizationId · deadline</text>
<text x="691" y="668" class="s">No automatic retries; failures reach the model as timeout / result_unknown …</text>
<text x="691" y="690" class="m">The platform does not know your devices: identity, presence and authorization are yours</text>

<path d="M280,640 H338" stroke="#db2777" stroke-width="1.8" marker-start="url(#h)" marker-end="url(#h)"/>
<path d="M600,640 H673" stroke="#db2777" stroke-width="1.8" marker-start="url(#h)" marker-end="url(#h)"/>
<path d="M1100,530 V573" stroke="#db2777" stroke-width="1.6" marker-end="url(#h)"/>
<text x="1094" y="556" text-anchor="end" class="m" style="fill:#db2777">tool call + Call Context</text>
</svg>