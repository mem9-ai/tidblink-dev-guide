<svg xml:lang="zh-CN" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 1188" role="img" aria-label="TiDB Link 接入流程">
<style>text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#1f2937}
.st{font-size:15px;font-weight:700}.chip{font-size:12px;font-weight:600}.num{font-size:13px;font-weight:700;fill:#fff}
.t{font-size:14px;font-weight:700}.s{font-size:12.5px;fill:#374151;font-family:ui-monospace,Menlo,Consolas,"Noto Sans CJK SC",monospace}
.m{font-size:12px;fill:#6b7280}.opt{font-size:11.5px;fill:#7c3aed;font-weight:600}.dl{font-size:12px;font-weight:700;fill:#fff}.dt{font-size:12.5px;fill:#fff}</style>
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#64748b"/></marker></defs>
<rect x="20" y="30" width="410" height="414" rx="14" fill="#eef2f7" opacity=".55"/>
<text x="36" y="58" class="st" style="fill:#64748b">阶段 0 | 准备</text>
<rect x="338.8" y="40" width="75.19999999999999" height="24" rx="12" fill="#fff" stroke="#64748b"/>
<text x="376.4" y="57" text-anchor="middle" class="chip" style="fill:#64748b">Console</text>
<rect x="32" y="80" width="386" height="78" rx="10" fill="#fff" stroke="#64748b" stroke-width="1.6"/>
<circle cx="56" cy="106" r="14" fill="#64748b"/><text x="56" y="111" text-anchor="middle" class="num">1</text>
<text x="78" y="111" class="t">签发组织 API 密钥</text>
<text x="44" y="134" class="s">组织所有者在 Console 操作</text>
<text x="44" y="150" class="m">→ 存入后端密钥管理系统</text>
<path d="M225.0,158 V174" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="32" y="176" width="386" height="78" rx="10" fill="#fff" stroke="#64748b" stroke-width="1.6"/>
<circle cx="56" cy="202" r="14" fill="#64748b"/><text x="56" y="207" text-anchor="middle" class="num">2</text>
<text x="78" y="207" class="t">检查权限与运行前提</text>
<text x="44" y="230" class="s">Sandbox · Drive9 · 模型</text>
<text x="44" y="246" class="m">否则首条消息返回 503 / 409</text>
<path d="M225.0,254 V372" stroke="#64748b" stroke-width="1.6" stroke-dasharray="2 4" marker-end="url(#a)"/>
<rect x="32" y="374" width="386" height="56" rx="10" fill="#64748b"/>
<text x="44" y="396" class="dl">✓ 完成标准</text>
<text x="44" y="417" class="dt">组织与目录可访问；运行依赖已确认</text>
<path d="M418,402 C472.5,402 412.5,100 465,100" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="455" y="30" width="410" height="414" rx="14" fill="#f3effd" opacity=".55"/>
<text x="471" y="58" class="st" style="fill:#7c3aed">阶段 1 | 定义智能体</text>
<rect x="773.8" y="40" width="75.19999999999999" height="24" rx="12" fill="#fff" stroke="#7c3aed"/>
<text x="811.4" y="57" text-anchor="middle" class="chip" style="fill:#7c3aed">组织密钥</text>
<rect x="467" y="80" width="386" height="78" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="6 4"/>
<circle cx="491" cy="106" r="14" fill="#7c3aed"/><text x="491" y="111" text-anchor="middle" class="num">3</text>
<text x="513" y="111" class="t">发布组织 Skill</text>
<text x="843" y="100" text-anchor="end" class="opt">可选</text>
<text x="479" y="134" class="s">上传 ZIP → 校验 → 发布</text>
<text x="479" y="150" class="m">获得 {skillId, version}</text>
<path d="M660.0,158 V174" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="467" y="176" width="386" height="78" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="1.6"/>
<circle cx="491" cy="202" r="14" fill="#7c3aed"/><text x="491" y="207" text-anchor="middle" class="num">4</text>
<text x="513" y="207" class="t">创建智能体模板</text>
<text x="479" y="230" class="s">reference-catalog → POST</text>
<text x="479" y="246" class="m">content@7；语音需设置 realtime</text>
<path d="M660.0,254 V372" stroke="#64748b" stroke-width="1.6" stroke-dasharray="2 4" marker-end="url(#a)"/>
<rect x="467" y="374" width="386" height="56" rx="10" fill="#7c3aed"/>
<text x="479" y="396" class="dl">✓ 完成标准</text>
<text x="479" y="417" class="dt">template.id → templateId + ETag</text>
<path d="M853,402 C907.5,402 847.5,100 900,100" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="890" y="30" width="410" height="414" rx="14" fill="#fff7e6" opacity=".55"/>
<text x="906" y="58" class="st" style="fill:#d97706">阶段 2 | 配置用户</text>
<rect x="1208.8" y="40" width="75.19999999999999" height="24" rx="12" fill="#fff" stroke="#d97706"/>
<text x="1246.4" y="57" text-anchor="middle" class="chip" style="fill:#d97706">组织密钥</text>
<rect x="902" y="80" width="386" height="78" rx="10" fill="#fff" stroke="#d97706" stroke-width="1.6"/>
<circle cx="926" cy="106" r="14" fill="#d97706"/><text x="926" y="111" text-anchor="middle" class="num">5</text>
<text x="948" y="111" class="t">建立用户映射</text>
<text x="914" y="134" class="s">应用用户 ↔ userId</text>
<text x="914" y="150" class="m">保存在你自己的数据库</text>
<path d="M1095.0,158 V174" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="902" y="176" width="386" height="78" rx="10" fill="#fff" stroke="#d97706" stroke-width="1.6"/>
<circle cx="926" cy="202" r="14" fill="#d97706"/><text x="926" y="207" text-anchor="middle" class="num">6</text>
<text x="948" y="207" class="t">创建终端用户</text>
<text x="914" y="230" class="s">POST /org/users</text>
<text x="914" y="246" class="m">按 externalId 去重；重试前查询列表</text>
<path d="M1095.0,254 V270" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="902" y="272" width="386" height="78" rx="10" fill="#fff" stroke="#d97706" stroke-width="1.6"/>
<circle cx="926" cy="298" r="14" fill="#d97706"/><text x="926" y="303" text-anchor="middle" class="num">7</text>
<text x="948" y="303" class="t">签发用户 API 密钥</text>
<text x="914" y="326" class="s">POST /org/users/{id}/api-keys</text>
<text x="914" y="342" class="m">token 只返回一次 → 密钥存储</text>
<path d="M1095.0,350 V372" stroke="#64748b" stroke-width="1.6" stroke-dasharray="2 4" marker-end="url(#a)"/>
<rect x="902" y="374" width="386" height="56" rx="10" fill="#d97706"/>
<text x="914" y="396" class="dl">✓ 完成标准</text>
<text x="914" y="417" class="dt">用户可见的列表中包含目标模板</text>
<rect x="20" y="470" width="410" height="702" rx="14" fill="#fdf2f8" opacity=".55"/>
<text x="36" y="498" class="st" style="fill:#db2777">阶段 3 | 接入设备</text>
<rect x="255.20000000000002" y="480" width="158.79999999999998" height="24" rx="12" fill="#fff" stroke="#db2777"/>
<text x="334.6" y="497" text-anchor="middle" class="chip" style="fill:#db2777">组织密钥 · Console</text>
<rect x="32" y="520" width="386" height="78" rx="10" fill="#fff" stroke="#db2777" stroke-width="1.6"/>
<circle cx="56" cy="546" r="14" fill="#db2777"/><text x="56" y="551" text-anchor="middle" class="num">8</text>
<text x="78" y="551" class="t">搭建设备服务器</text>
<text x="44" y="574" class="s">MCP 服务器；用你的协议连接设备</text>
<text x="44" y="590" class="m">sessionId → 用户 → 设备；按 callId 去重</text>
<path d="M225.0,598 V614" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="32" y="616" width="386" height="78" rx="10" fill="#fff" stroke="#db2777" stroke-width="1.6"/>
<circle cx="56" cy="642" r="14" fill="#db2777"/><text x="56" y="647" text-anchor="middle" class="num">9</text>
<text x="78" y="647" class="t">注册 Connector</text>
<text x="44" y="670" class="s">POST /api/v1/org/connectors</text>
<text x="44" y="686" class="m">connectorKey 只返回一次 → 服务器</text>
<path d="M225.0,694 V710" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="32" y="712" width="386" height="78" rx="10" fill="#fff" stroke="#db2777" stroke-width="1.6"/>
<circle cx="56" cy="738" r="14" fill="#db2777"/><text x="56" y="743" text-anchor="middle" class="num">10</text>
<text x="78" y="743" class="t">建立传输通道</text>
<text x="44" y="766" class="s">streamable_http 或 tunnel</text>
<text x="44" y="782" class="m">tunnel：连接 /api/v1/connectors/ws</text>
<path d="M225.0,790 V806" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="32" y="808" width="386" height="78" rx="10" fill="#fff" stroke="#db2777" stroke-width="1.6"/>
<circle cx="56" cy="834" r="14" fill="#db2777"/><text x="56" y="839" text-anchor="middle" class="num">11</text>
<text x="78" y="839" class="t">激活 Connector</text>
<text x="44" y="862" class="s">POST …/{id}/activate</text>
<text x="44" y="878" class="m">发现并冻结工具目录</text>
<path d="M225.0,886 V902" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="32" y="904" width="386" height="78" rx="10" fill="#fff" stroke="#db2777" stroke-width="1.6"/>
<circle cx="56" cy="930" r="14" fill="#db2777"/><text x="56" y="935" text-anchor="middle" class="num">12</text>
<text x="78" y="935" class="t">从模板引用 Connector</text>
<text x="44" y="958" class="s">Console 模板编辑器</text>
<text x="44" y="974" class="m">在创建需要它的 Session 之前完成</text>
<path d="M225.0,982 V1100" stroke="#64748b" stroke-width="1.6" stroke-dasharray="2 4" marker-end="url(#a)"/>
<rect x="32" y="1102" width="386" height="56" rx="10" fill="#db2777"/>
<text x="44" y="1124" class="dl">✓ 完成标准</text>
<text x="44" y="1145" class="dt">Connector 已激活且已被引用</text>
<path d="M418,1130 C472.5,1130 412.5,540 465,540" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="455" y="470" width="410" height="702" rx="14" fill="#e8f6f3" opacity=".55"/>
<text x="471" y="498" class="st" style="fill:#0f766e">阶段 4 | 文本对话</text>
<rect x="766.2" y="480" width="82.8" height="24" rx="12" fill="#fff" stroke="#0f766e"/>
<text x="807.6" y="497" text-anchor="middle" class="chip" style="fill:#0f766e">用户密钥</text>
<rect x="467" y="520" width="386" height="78" rx="10" fill="#fff" stroke="#0f766e" stroke-width="1.6"/>
<circle cx="491" cy="546" r="14" fill="#0f766e"/><text x="491" y="551" text-anchor="middle" class="num">13</text>
<text x="513" y="551" class="t">创建 Agent</text>
<text x="479" y="574" class="s">POST /user/agents</text>
<text x="479" y="590" class="m">Idempotency-Key；保存 agentId</text>
<path d="M660.0,598 V614" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="467" y="616" width="386" height="78" rx="10" fill="#fff" stroke="#0f766e" stroke-width="1.6"/>
<circle cx="491" cy="642" r="14" fill="#0f766e"/><text x="491" y="647" text-anchor="middle" class="num">14</text>
<text x="513" y="647" class="t">创建 Session</text>
<text x="479" y="670" class="s">POST /user/sessions</text>
<text x="479" y="686" class="m">冻结模板；记录 sessionId</text>
<path d="M660.0,694 V710" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="467" y="712" width="386" height="78" rx="10" fill="#fff" stroke="#0f766e" stroke-width="1.6"/>
<circle cx="491" cy="738" r="14" fill="#0f766e"/><text x="491" y="743" text-anchor="middle" class="num">15</text>
<text x="513" y="743" class="t">订阅事件（SSE）</text>
<text x="479" y="766" class="s">GET …/events?stream=true</text>
<text x="479" y="782" class="m">持久化游标；断连后恢复</text>
<path d="M660.0,790 V806" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="467" y="808" width="386" height="78" rx="10" fill="#fff" stroke="#0f766e" stroke-width="1.6"/>
<circle cx="491" cy="834" r="14" fill="#0f766e"/><text x="491" y="839" text-anchor="middle" class="num">16</text>
<text x="513" y="839" class="t">发送消息</text>
<text x="479" y="862" class="s">POST …/events → 202 回执</text>
<text x="479" y="878" class="m">发送前持久化 clientEventId</text>
<path d="M660.0,886 V902" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="467" y="904" width="386" height="78" rx="10" fill="#fff" stroke="#0f766e" stroke-width="1.6"/>
<circle cx="491" cy="930" r="14" fill="#0f766e"/><text x="491" y="935" text-anchor="middle" class="num">17</text>
<text x="513" y="935" class="t">渲染事件</text>
<text x="479" y="958" class="s">用快照替换草稿；保留最终回复</text>
<text x="479" y="974" class="m">设备调用显示为 operation_step</text>
<path d="M660.0,982 V1100" stroke="#64748b" stroke-width="1.6" stroke-dasharray="2 4" marker-end="url(#a)"/>
<rect x="467" y="1102" width="386" height="56" rx="10" fill="#0f766e"/>
<text x="479" y="1124" class="dl">✓ 完成标准</text>
<text x="479" y="1145" class="dt">观察到 Turn 终态事件</text>
<path d="M853,1130 C907.5,1130 847.5,540 900,540" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="890" y="470" width="410" height="702" rx="14" fill="#eef3fb" opacity=".55"/>
<text x="906" y="498" class="st" style="fill:#2563eb">阶段 5 | 语音对话</text>
<rect x="1201.2" y="480" width="82.8" height="24" rx="12" fill="#fff" stroke="#2563eb"/>
<text x="1242.6" y="497" text-anchor="middle" class="chip" style="fill:#2563eb">用户密钥</text>
<rect x="902" y="520" width="386" height="78" rx="10" fill="#fff" stroke="#2563eb" stroke-width="1.6"/>
<circle cx="926" cy="546" r="14" fill="#2563eb"/><text x="926" y="551" text-anchor="middle" class="num">18</text>
<text x="948" y="551" class="t">检查 Session 支持语音</text>
<text x="914" y="574" class="s">realtimeVoice 不为 null</text>
<text x="914" y="590" class="m">在步骤 4 设置；否则返回 409</text>
<path d="M1095.0,598 V614" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="902" y="616" width="386" height="78" rx="10" fill="#fff" stroke="#2563eb" stroke-width="1.6"/>
<circle cx="926" cy="642" r="14" fill="#2563eb"/><text x="926" y="647" text-anchor="middle" class="num">19</text>
<text x="948" y="647" class="t">在后端开启 Realtime</text>
<text x="914" y="670" class="s">POST …/sessions/{id}/realtime</text>
<text x="914" y="686" class="m">websocketUrl + 60 秒 connectToken</text>
<path d="M1095.0,694 V710" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="902" y="712" width="386" height="78" rx="10" fill="#fff" stroke="#2563eb" stroke-width="1.6"/>
<circle cx="926" cy="738" r="14" fill="#2563eb"/><text x="926" y="743" text-anchor="middle" class="num">20</text>
<text x="948" y="743" class="t">连接客户端 WebSocket</text>
<text x="914" y="766" class="s">tidb-link.realtime.v1</text>
<text x="914" y="782" class="m">session.connect → 等待就绪</text>
<path d="M1095.0,790 V806" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="902" y="808" width="386" height="78" rx="10" fill="#fff" stroke="#2563eb" stroke-width="1.6"/>
<circle cx="926" cy="834" r="14" fill="#2563eb"/><text x="926" y="839" text-anchor="middle" class="num">21</text>
<text x="948" y="839" class="t">传输音频</text>
<text x="914" y="862" class="s">上行 0x01 帧 · 下行 0x02 帧</text>
<text x="914" y="878" class="m">同一 response_id 内按序播放</text>
<path d="M1095.0,886 V902" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="902" y="904" width="386" height="78" rx="10" fill="#fff" stroke="#2563eb" stroke-width="1.6"/>
<circle cx="926" cy="930" r="14" fill="#2563eb"/><text x="926" y="935" text-anchor="middle" class="num">22</text>
<text x="948" y="935" class="t">上报播放进度，处理打断</text>
<text x="914" y="958" class="s">playback.progress / .stopped</text>
<text x="914" y="974" class="m">打断时清空本地队列</text>
<path d="M1095.0,982 V998" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="902" y="1000" width="386" height="78" rx="10" fill="#fff" stroke="#2563eb" stroke-width="1.6"/>
<circle cx="926" cy="1026" r="14" fill="#2563eb"/><text x="926" y="1031" text-anchor="middle" class="num">23</text>
<text x="948" y="1031" class="t">重连或结束</text>
<text x="914" y="1054" class="s">…/realtime/connect-tokens</text>
<text x="914" y="1070" class="m">resume_after_event_id；session.end</text>
<path d="M1095.0,1078 V1100" stroke="#64748b" stroke-width="1.6" stroke-dasharray="2 4" marker-end="url(#a)"/>
<rect x="902" y="1102" width="386" height="56" rx="10" fill="#2563eb"/>
<text x="914" y="1124" class="dl">✓ 完成标准</text>
<text x="914" y="1145" class="dt">session.ready 后收到语音回复</text>
<path d="M1095.0,430 V458 H225.0 V466" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="660.0" y="452" text-anchor="middle" class="m">没有硬件时跳过阶段 3</text>
</svg>