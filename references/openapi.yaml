  /api/v1/drive-downloads/{ticket}:
    get:
      description: >-
        Anonymous, ticket-authorized endpoint for every authenticated download resource kind.
        Returns complete same-path inline bytes or an HTTPS Drive9 storage redirect with bounded
        presign exposure.


        Authorization: short-lived download ticket; no API Key required.
      operationId: DriveDownloadController_redeem
      parameters:
        - name: ticket
          required: true
          in: path
          description: Opaque 60-second download ticket; consumers must follow the current maxLength.
          schema:
            type: string
            maxLength: 410
      responses:
        '200':
          description: Complete bytes currently stored at the ticket-bound path.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
            Content-Disposition:
              schema:
                type: string
            Content-Length:
              schema:
                type: string
            Content-Type:
              schema:
                type: string
                example: application/octet-stream
            Referrer-Policy:
              schema:
                type: string
                example: no-referrer
            X-Content-Type-Options:
              schema:
                type: string
                example: nosniff
        '302':
          description: HTTPS Drive9 storage redirect with bounded presign exposure.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
            Content-Length:
              schema:
                type: string
                example: '0'
            Location:
              description: Validated Drive9 storage URL.
              schema:
                type: string
                format: uri
            Referrer-Policy:
              schema:
                type: string
                example: no-referrer
            X-Content-Type-Options:
              schema:
                type: string
                example: nosniff
        '404':
          description: Invalid, expired, or missing file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Download redemption rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '502':
          description: Drive9 returned an invalid response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Download service temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security: []
      summary: Redeem a short-lived download ticket.
      tags:
        - Drive
