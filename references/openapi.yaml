info:
  title: TiDB Link Customer API
  version: 0.0.1
  description:
    Customer integration API at /api/v1. Operations declare End User API Key, Organization
    API Key or ticket authorization. Old customer addresses have been removed without aliases;
    existing SDKs and external callers require a separate migration.
tags: []
servers:
  - url: http://localhost:3000
    description: Local development
components:
  securitySchemes:
    HardwareCredentialAuth:
      scheme: bearer
      bearerFormat: opaque
      type: http
      description: Hardware Credential authenticates only one inventoried device on
        /api/v1/hardware/connect. It grants no User, Session or management authority. Send it in
        Authorization, never in a URL.
    ConnectorKeyAuth:
      scheme: bearer
      bearerFormat: opaque
      type: http
      description: Connector Key authenticates only tunnel connections on /api/v1/connectors/ws. It
        identifies one Organization-owned Connector and grants no End User, Session or management
        authority. Send it in Authorization, never in a URL.
    UserApiKey:
      scheme: bearer
      bearerFormat: opaque
      type: http
      description:
        'Opaque ti_user_<id>_<secret> credential: ASCII alphanumeric id body (1–64), unpadded
        base64url secret (43 characters from 32 random bytes). Authenticates the bound User and
        Organization. The persisted key owner determines scope.'
    OrganizationApiKey:
      scheme: bearer
      bearerFormat: opaque
      type: http
      description:
        'Opaque ti_org_<id>_<secret> credential: ASCII alphanumeric id body (1–64), unpadded
        base64url secret (43 characters from 32 random bytes). Authenticates an Organization machine
        principal with no acting User. Each handler explicitly chooses whether to admit this
        principal kind.'
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
    TurnIdPath:
      name: turnId
      in: path
      required: true
