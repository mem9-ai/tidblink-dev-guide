                              minimum: 0
                              exclusiveMinimum: true
                            channels:
                              type: number
                              minimum: 1
                              maximum: 1
                            packetDurationMs:
                              description: Duration of each Opus packet.
                              type: integer
                              minimum: 0
                              exclusiveMinimum: true
                            bitrate:
                              description: Output CBR in bps; absent on input and historical connections.
                              oneOf:
                                - type: number
                                  minimum: 16000
                                  maximum: 16000
                                - type: number
                                  minimum: 24000
                                  maximum: 24000
                                - type: number
                                  minimum: 32000
                                  maximum: 32000
                          required:
                            - encoding
                            - sampleRate
                            - channels
                            - packetDurationMs
                    output:
                      description: One direction of the Realtime connection audio format.
                      oneOf:
                        - type: object
                          properties:
                            encoding:
                              description: Little-endian mono samples.
                              type: string
                              enum:
                                - pcm16
                            sampleRate:
                              type: integer
                              minimum: 0
                              exclusiveMinimum: true
                            channels:
                              type: number
                              minimum: 1
                              maximum: 1
                          required:
                            - encoding
