  /api/v1/connectors/ws:
    get:
      description: >-
        Upgrade to WebSocket using a Connector Key Bearer header, the tidb-link.connector.v1
        subprotocol, and an X-Ti-Connector-Instance header naming this instance. The platform is the
        MCP client on the socket: it drives initialize and tools/list, and the developer server
        answers. One JSON-RPC 2.0 message per text frame. Close codes: 4001 auth failure, 4003
        Connector without the tunnel transport, 4008 replaced by a same-name instance, 4009 protocol
        error. The platform pings every 20 seconds and disconnects after two missed pongs. Ordinary
        HTTP receives 426.


        Authorization: ConnectorKeyAuth; the persisted Connector Key identifies one
        Organization-owned Connector and grants no End User, Session or management authority.
      operationId: ConnectorTunnelController_get
      parameters:
        - name: X-Ti-Connector-Instance
          in: header
          description:
            Developer-chosen instance id. A reconnecting instance with the same id replaces its
            stale connection (close code 4008).
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: Sec-WebSocket-Protocol
          in: header
          required: true
          schema:
            type: string
            enum:
              - tidb-link.connector.v1
      responses:
        '101':
          description:
            WebSocket upgraded; the platform drives the MCP initialize handshake, then the
            connection is ready.
        '400':
          description: Invalid upgrade or unsupported subprotocol.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
        '426':
          description: 'ErrorEnvelope code: websocket_required. WebSocket upgrade required.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
        '429':
          description: Replica connection admission limit reached; back off.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
        '503':
          description: The tunnel gateway is stopping.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
      security:
        - ConnectorKeyAuth: []
      summary: Open a Connector tunnel WebSocket
      tags:
        - ConnectorTunnel
