  /api/v1/hardware/connect:
    get:
      description: >-
        Upgrade to WebSocket using a Hardware Credential Bearer header and tidb-link.hardware.v1
        subprotocol. Valid hello initializes the persisted connection. See the Hardware Connection
        protocol for messages, limits and fencing. Ordinary HTTP receives 426.


        Authorization: HardwareCredentialAuth; the persisted credential identifies one
        Organization-owned Hardware and grants no End User, Session or management authority.
      operationId: HardwareConnectController_get
      parameters:
        - name: Sec-WebSocket-Protocol
          in: header
          required: true
          schema:
            type: string
            enum:
              - tidb-link.hardware.v1
      responses:
        '101':
          description: WebSocket upgraded; send hello within 10 seconds.
        '400':
          description: Invalid upgrade, query string or unsupported subprotocol.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
        '401':
          description: Missing, invalid or revoked Hardware Credential.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
        '403':
          description: Hardware is retired.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
        '426':
          description: 'ErrorEnvelope code: websocket_required. WebSocket upgrade required.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
        '429':
          description: Replica connection admission limit reached; back off.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
        '503':
          description: Hardware authentication is temporarily unavailable.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
      security:
        - HardwareCredentialAuth: []
      summary: Open an independent Hardware WebSocket
      tags:
        - HardwareConnect
