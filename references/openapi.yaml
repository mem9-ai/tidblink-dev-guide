                id:
                  description: Realtime connection ID.
                  type: string
                status:
                  description:
                    'connecting: admitted, but the realtime audio stream is not open yet. active: the
                    stream is open and the user can speak, including while a task runs. paused: the
                    stream is still open, but the current task is waiting for the user to answer a
                    clarification question; answering resumes it.'
