  /api/v1/agents/{agentId}/hardware-bindings/{hardwareRequirementId}:
    put:
      operationId: putAgentHardwareBinding
      parameters:
        - name: agentId
          required: true
          in: path
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: hardwareRequirementId
          required: true
          in: path
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
            pattern: ^[!-~]+$
        - name: If-Match
          in: header
          description:
            Current strong binding ETag, including publication identity for an association Agent.
            Original committed command replay retains its original validator.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HardwareBindingBodyDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardwareBindingReceiptDto'
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
        '400':
          description: 'ErrorEnvelope code: validation_error, invalid_idempotency_key.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
        '401':
          description: 'ErrorEnvelope code: authentication_required.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
        '403':
          description: 'ErrorEnvelope code: user_api_key_required.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
        '404':
          description: 'ErrorEnvelope code: resource_not_found.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
        '409':
          description:
            'ErrorEnvelope code: hardware_binding_unavailable, hardware_registration_unavailable,
            idempotency_key_reused.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
        '412':
          description: 'ErrorEnvelope code: precondition_failed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
        '428':
          description: 'ErrorEnvelope code: precondition_required.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
        '500':
          description: 'ErrorEnvelope code: binding_receipt_integrity.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
        '503':
          description: 'ErrorEnvelope code: auth_temporarily_unavailable, binding_commit_unknown.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
      security:
        - UserApiKey: []
      summary: Commit or recover the same atomic personal binding command.
      tags:
        - HardwareBindings
      description: 'Authorization: UserApiKey; persisted credentials determine Organization and End User scope.'
