          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 'ErrorEnvelope code: authentication_required.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description:
            'ErrorEnvelope code: user_api_key_required. Only a User API Key is accepted; a browser
            Session or an Organization API Key is refused.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
