  /api/v1/user/sessions/{id}/turns/audio:
    post:
      operationId: SessionsController_createAudioTurn
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: 'Audio file to transcribe. Supported formats: mp3, mp4, mpeg, mpga, m4a, wav, webm.'
                billingTag:
                  nullable: true
                  description:
                    Omit to inherit the Session default, send one JSON Billing Tag object to override it,
                    or send the JSON literal null to clear it for this Turn.
                  allOf:
                    - $ref: '#/components/schemas/BillingTag'
            encoding:
              billingTag:
                contentType: application/json
      responses:
        '201':
          description:
            Audio Turn outside ordinary JSON text input identity/recovery guarantees. The owning
            response uses SSE frames whose event name and JSON data identify the TurnStreamEvent,
            with comment keepalives; turn_started may omit inputId. Closing its active upstream
            requests interruption. Cancel an owned live Turn through POST events with a stable
            clientEventId and its exact turnId.
          content:
            text/event-stream:
              schema:
                type: string
                description:
                  'Each SSE frame contains event: <TurnStreamEvent.event> and data: <TurnStreamEvent
                  JSON>, terminated by a blank line. Comment frames are keepalive heartbeats.'
                x-sse-event-schema:
                  $ref: '#/components/schemas/TurnStreamEvent'
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-cache, no-transform
            X-Accel-Buffering:
              required: true
              schema:
                type: string
                enum:
                  - no
        '409':
          description: The Session is read-only (session_read_only), or already has an active Turn
            (session_has_active_turn), either before transcription or reservation, or because
            another Turn starts during transcription. Conflicts after accepted transcription retain
            ASR usage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: The platform-funded LLM spend limit is exhausted before streaming starts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: llm_spend_limit_exhausted
                  message: LLM spend limit exhausted
        '501':
          description: Audio transcription is disabled because ASR_OPENAI_API_KEY is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description:
            New Turn admission is temporarily closed for deployment maintenance or recovery
            (turn_admission_closed), or the deployment lacks the Sandbox or Drive9 service a new
            Turn needs (service_configuration_unavailable; details.reason names it). Normally this
            refusal happens before the audio is read, transcribed or billed and before anything is
            saved. If the configuration changes concurrently, the same 503 can follow transcription;
            that transcription remains billed and no Turn is saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: turn_admission_closed
                  message: New Turns are temporarily unavailable
        default:
          $ref: '#/components/responses/Error'
      security:
        - UserApiKey: []
      tags:
        - Sessions
      description: 'Authorization: UserApiKey; persisted credentials determine Organization and End User scope.'
  /api/v1/user/sessions/{id}/timeline:
    get:
      operationId: SessionsController_timeline
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: cursor
          required: false
          in: query
          description: Opaque owning User and Session continuation cursor from nextCursor.
          schema:
            type: string
        - name: limit
          required: false
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description:
            'A bounded page of the Session timeline. Each entry is a complete Turn (messages with
            inputContext, Operations with category and skill, Artifact publications) or one Realtime
            fact: a final user transcript or a completed Realtime model response. Realtime facts
            follow their durable write order. A Turn started by a Realtime utterance (a task or a
            clarification answer) is placed directly after that utterance; every other Turn,
            including one a Realtime utterance only steered, sits where its first event was saved.
            Because that utterance is saved after the Turn starts, a client that paged past such a
            Turn in the meantime can see it again on a later page; nothing is skipped. Key entries
            by Turn id and Realtime fact id, replace an entry that arrives again, and group Realtime
            facts by their turnId. A running Turn is a snapshot of its progress so far; read it
            again or follow GET /events for later changes.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTimelineResponseOpenApiDto'
        '400':
          description: Invalid limit, or a malformed, foreign or unknown continuation cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        default:
          $ref: '#/components/responses/Error'
          description: Unavailable owning Session or unsupported, invalid or unavailable credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
        - UserApiKey: []
      tags:
        - Sessions
      description: 'Authorization: UserApiKey; persisted credentials determine Organization and End User scope.'
  /api/v1/user/sessions/{id}/turns:
    get:
      operationId: SessionsController_listTurns
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: cursor
          required: false
          in: query
          description:
            Opaque owning User and Session continuation cursor; chronological creation order with
            Turn ID as tie breaker.
