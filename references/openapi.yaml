  /api/v1/user/sessions/{id}/realtime:
    post:
      description: >-
        Admits a Realtime connection on an existing Session owned by the authenticated End User. The
        connection inherits the Session’s Agent and Billing Tag and freezes the Session’s selected
        Realtime Model and its provider identity. A null Session selection uses the release default;
        a withdrawn selection is refused without fallback. Changing the Session selection affects
        only the next connection. The response carries a first one-time connect token; mint more
        with POST /api/v1/user/sessions/{id}/realtime/connect-tokens. A Session has at most one live
        (connecting, active or paused) Realtime connection: while one exists this route answers 409
        realtime_connection_live with details [{ "path": "/", "reason": "live realtime connection
        <id>" }]. Text and Realtime interaction may alternate on the same Session. A connection that
        never connects within 120 seconds, or whose server runtime stopped renewing its lease for 60
        seconds, is ended automatically.


        Authorization: UserApiKey; persisted credentials determine Organization and End User scope.
