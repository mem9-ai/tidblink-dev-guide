    OpenRealtimeConnectionOpenApiDto:
      type: object
      properties:
        audio:
          description:
            'Client audio formats, chosen independently per direction; mono only. Input: pcm16 8000
            or 16000 Hz (default), or opus 16000 Hz with packetDurationMs 20 (default), 40 or 60.
            Output: pcm16 8000, 16000 or 24000 Hz (default), or opus 24000 Hz with packetDurationMs
            20 and fixed bitrate 16000, 24000 or 32000 bps (default 32000). bitrate is accepted only
            on opus output. PCM16 8000 Hz input is resampled to 16000 Hz, and 24000 Hz provider
            output to the selected lower PCM16 rate, when required; 8000 Hz has telephone quality
            and can reduce recognition accuracy. Anything else, or a format the configured Realtime
            model cannot be served with, answers 400 audio_format_unsupported with one detail per
            refused direction, naming its first unsupported field.'
          type: object
          properties:
            input:
              type: object
              properties:
                encoding:
                  description: pcm16 or opus.
                  type: string
                  minLength: 1
                  maxLength: 32
                sampleRate:
                  type: integer
                  minimum: 0
                  exclusiveMinimum: true
                channels:
                  type: integer
                  minimum: 0
                  exclusiveMinimum: true
                packetDurationMs:
                  description: 'Opus only: the duration of each packet; one packet travels in one audio frame.'
                  type: integer
                  minimum: 0
                  exclusiveMinimum: true
                bitrate:
                  description:
                    'Opus output only: fixed bitrate in bps, 16000, 24000 or 32000 (default). Rejected on
                    input and pcm16. Unsupported numeric values answer 400
                    audio_format_unsupported.'
                  type: number
              required:
                - encoding
                - sampleRate
                - channels
            output:
              type: object
              properties:
                encoding:
                  description: pcm16 or opus.
                  type: string
                  minLength: 1
                  maxLength: 32
                sampleRate:
                  type: integer
                  minimum: 0
                  exclusiveMinimum: true
                channels:
                  type: integer
                  minimum: 0
                  exclusiveMinimum: true
                packetDurationMs:
                  description: 'Opus only: the duration of each packet; one packet travels in one audio frame.'
                  type: integer
                  minimum: 0
                  exclusiveMinimum: true
                bitrate:
                  description:
                    'Opus output only: fixed bitrate in bps, 16000, 24000 or 32000 (default). Rejected on
                    input and pcm16. Unsupported numeric values answer 400
                    audio_format_unsupported.'
                  type: number
              required:
                - encoding
                - sampleRate
                - channels
        metadata:
          description: Client string metadata, stored verbatim and echoed on the Realtime connection.
          type: object
          additionalProperties:
            type: string
            maxLength: 512
