            message:
              type: string
            details:
              nullable: true
    Message:
      type: object
      required:
        - id
        - sessionId
        - turnId
        - role
        - content
        - createdAt
      properties:
        id:
          type: string
        sessionId:
          type: string
        turnId:
          type: string
        role:
          type: string
          enum:
            - user
            - assistant
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        inputContext:
          $ref: '#/components/schemas/MessageInputContext'
        realtime:
          oneOf:
            - type: object
              properties:
                startsTurn:
                  type: boolean
                linkedTurnId:
                  type: string
                  nullable: true
              required:
                - startsTurn
                - linkedTurnId
            - type: object
              properties:
                kind:
                  type: string
                  enum:
                    - chat
                    - task_ack
                    - task_progress
                    - task_result
                    - clarify
                    - device_ack
                interrupted:
                  description: The reply was interrupted; its transcript may include speech the user did not hear.
                  type: boolean
                responseId:
                  type: string
                  nullable: true
                linkedTurnId:
                  type: string
                  nullable: true
              required:
                - kind
                - interrupted
                - responseId
                - linkedTurnId
    MessageInputContext:
      description: Server-recorded channel of a user input; clients cannot set it. Present on user
        Messages except Scheduler-triggered Turns and Messages saved before it existed; absent on
        assistant Messages. Tolerate channel values added later.
      oneOf:
        - type: object
          required:
            - channel
          properties:
            channel:
              type: string
              enum:
                - text
        - type: object
          required:
            - channel
          properties:
            channel:
              type: string
              enum:
                - audio
            utterance:
              description:
                Transcript of the user's own speech when the Message content is a task delegated from
                it.
              type: string
              minLength: 1
              maxLength: 8000
            emotion:
              description: Emotion the Realtime model perceived in the speech; not a verified fact.
              type: object
              required:
                - label
                - confidence
                - source
              properties:
                label:
                  type: string
                  minLength: 1
                  maxLength: 64
                confidence:
                  type: number
                  minimum: 0
                  maximum: 1
                source:
                  type: string
                  enum:
                    - realtime_model
            realtimeSummary:
              description:
                The Realtime model's own summary of the preceding voice conversation; model-written,
                not a durable transcript. Interim field, removed once the server derives this
                context.
              type: string
              minLength: 1
              maxLength: 8000
        - description:
            "A Realtime Standing Task cycle: the platform started this Turn with the Template's
            standing goal while a Realtime Connection was live; nobody typed or spoke it."
          type: object
          required:
            - channel
          properties:
            channel:
              type: string
              enum:
                - standing_task
    Operation:
      type: object
      required:
        - id
        - sessionId
        - turnId
        - scope
        - kind
        - backend
        - targetKind
        - mediator
        - status
        - input
        - resultPointer
        - createdAt
      properties:
        id:
          type: string
        sessionId:
          type: string
        turnId:
          type: string
        scope:
          type: object
          additionalProperties: true
        kind:
          type: string
          description: Historical long-term Memory Operations remain records only.
        backend:
          type: string
          description: Historical long-term Memory Operations may retain the `mem9` backend value.
        targetKind:
          type: string
          description: Historical long-term Memory Operations may retain the `memory` target kind.
        mediator:
          type: string
          enum:
            - aos
        status:
          type: string
          enum:
            - running
            - succeeded
            - failed
            - interrupted
            - unknown_result
        category:
          type: string
          enum:
            - tool_call
            - skill_read
          description:
            "How to group a tool Operation: skill_read when it reads a file inside one of its
            AgentRun's frozen Skill packages, whether Runtime loaded the Skill instructions or the
            model read a package file; tool_call for every other tool Operation. Absent on non-tool
            Operations such as llm.complete and on metadata-only Operations."
        skill:
          $ref: '#/components/schemas/OperationSkill'
        input:
          description:
            Kind-specific input. Hardware Client Tool Operations expose only toolName, callId and
            mode, omitting device arguments.
        output:
          description:
            'Hardware Client Tool Operations omit output in every status. Kind-specific result. An
            llm.complete Operation exposes usage as token counts only: input, output, cacheRead,
            cacheWrite, totalTokens, and optional cacheWrite1h and reasoning. Counts that are
            unavailable or invalid are omitted; absent usage is omitted. Supplier SDK cost is not
            exposed. Customer fees are available from the Billing usage APIs. A failed or
            interrupted llm.complete Operation has error {code, message, details?} with fixed text
            only; model_provider_failed carries details.provider (category, (category, httpStatus,
            errorType, errorCode); other failures use runtime_error or a ledger outcome code. Any
            other failed, interrupted or unknown_result Operation with an error, including tool
            Operations, has error {code, message, details} with fixed text naming only the tool: an
            intentional tool code (for example mcp_unavailable or validation_error) is kept; an
            allow-listed web_search_* or session_recall_* reason becomes the code and is repeated as
            details.code with a boolean details.retryable; anything else reads tool_failed. A
            memory.recall Operation keeps only memory_recall_failed, turn_interrupted or
            operation_result_unknown, and otherwise reads tool_failed. details also carries tool,
            category (rejected, unavailable, remote_error, failed, unknown_result, interrupted or
            unexpected) and, when known, dispatch and retryContract.'
        resultPointer:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        source:
          $ref: '#/components/schemas/ClientToolOperationSource'
        label:
          type: string
          maxLength: 322
          description:
            Readable Hardware Client Tool label, for example Speaker · set_volume. Absent on
            metadata-only Operations.
    OperationSkill:
      type: object
      description: The Skill a skill_read Operation read from; present only with category skill_read.
      required:
        - skillId
        - name
      properties:
        skillId:
          type: string
        name:
          type: string
    TurnUserFile:
      type: object
      properties:
        turnId:
          type: string
        sessionId:
          type: string
        organizationId:
          type: string
        userFileId:
          type: string
        ordinal:
          type: integer
        originalName:
          type: string
        safeName:
          type: string
        drivePath:
          type: string
        byteSize:
          type: integer
        sha256:
          type: string
        checksumVerification:
          type: string
          enum:
            - whole
            - part_only
          nullable: true
        contentType:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - turnId
        - sessionId
        - organizationId
