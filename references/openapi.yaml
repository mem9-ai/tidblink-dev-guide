                            - channels
                        - type: object
                          properties:
                            encoding:
                              description: One Opus packet per audio frame, decoded at sampleRate.
                              type: string
                              enum:
                                - opus
                            sampleRate:
                              type: integer
                              minimum: 0
                              exclusiveMinimum: true
                            channels:
                              type: number
                              minimum: 1
                              maximum: 1
                            packetDurationMs:
                              description: Duration of each Opus packet.
                              type: integer
                              minimum: 0
                              exclusiveMinimum: true
                            bitrate:
                              description: Output CBR in bps; absent on input and historical connections.
                              oneOf:
                                - type: number
                                  minimum: 16000
                                  maximum: 16000
                                - type: number
                                  minimum: 24000
                                  maximum: 24000
                                - type: number
                                  minimum: 32000
                                  maximum: 32000
                          required:
                            - encoding
                            - sampleRate
                            - channels
                            - packetDurationMs
                  required:
                    - input
                    - output
                startedAt:
                  description: When the Realtime connection was admitted.
                  type: string
              required:
                - id
                - status
                - audio
                - startedAt
              nullable: true
            createdAt:
              type: string
            updatedAt:
              type: string
            deletedAt:
              type: string
              nullable: true
          required:
