  /api/v1/user/sessions/{id}/events:
    get:
      operationId: SessionsController_events
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: Accept
          in: header
          required: true
          schema:
            type: string
            enum:
              - text/event-stream
        - name: cursor
          required: false
          in: query
          description: Opaque cursor returned in the SSE id field for continuation.
          schema:
            type: string
        - name: stream
          required: true
          in: query
          schema:
            type: boolean
            enum:
              - true
      responses:
        '200':
          description:
            'A persisted Server-Sent Events stream under current User Key, ordinary User, and
            Organization authority. Revocation, rotation, or disabling the User or Organization
            closes the subscription. The cursor in each id field can be supplied on a later request.
            Disconnecting the subscription does not cancel the active Turn. Each data frame is a
            JSON envelope with type, sessionId, turnId, createdAt and data. Turn events
            (agent.session.turn.*) carry the durable Turn event in data. Realtime facts of the
            Session timeline arrive in the same order:
            agent.session.realtime.input_transcript.completed for each final user transcript and
            agent.session.realtime.response.completed for each completed Realtime model response,
            with data {id, type, realtimeConnectionId, text, turnId, createdAt} and, for a response,
            kind (chat, task_ack, task_progress, task_result, clarify; historical device_ack remains
            readable), responseId and interrupted. Their envelope turnId is the linked Turn or null.
            Partial Realtime transcripts are delivered only on the realtime connection.
            agent.session.turn.output_text.snapshot carries the complete provisional draft in
            data.payload.text: replace the draft for that turnId, including revisions or an empty
            reset, rather than appending. A resumed snapshot is independently usable without earlier
            draft frames. agent.session.turn.progress carries a separate progress message in
            data.payload.text. agent.session.turn.item.added with data.event = assistant_message
            carries the final saved message in data.payload.text and data.payload.messageId; the
            terminal Turn event establishes its outcome. agent.session.turn.item.added with
            data.event = operation_step carries data.payload.operationId, status and label; a tool
            Operation also carries data.payload.category (skill_read for a read inside a frozen
            Skill package, with data.payload.skill {skillId, name}; otherwise tool_call), matching
            the Operation in Turn reads. Client Tool progress also carries safe data.payload.source:
            {type: session_client} or {type: hardware, hardwareRequirementId, method}; Hardware
            labels identify the requirement and original method. Hardware arguments, outputs and
            private target identities are omitted from progress and Turn Operations. The
            hardware_read_state platform tool creates a hardware.state.read Operation; public input
            contains only its tool name and requirement identifier, and output omits sensor data.
            Metadata-only Operations omit source. Events saved before these fields existed omit
            them. agent.session.turn.requires_action with data.event = client_tool_calls carries
            data.payload.calls, the Client Tool calls of one model step, each with callId, name,
            arguments and deadlineAt; answer each with agent.session.input.client_tool_output before
            its deadline. Receiving this event counts as delivery of its calls. No output_text.delta
            alias is emitted.'
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-cache, no-transform
            X-Accel-Buffering:
              required: true
              schema:
                type: string
                enum:
                  - no
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          description: The stream selector, Accept header, or continuation cursor is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: An active End User principal is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: The Session is unavailable or authorization-hidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
        - UserApiKey: []
      tags:
        - Sessions
      description: 'Authorization: UserApiKey; persisted credentials determine Organization and End User scope.'
    post:
      operationId: SessionsController_submitEvent
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionEventOpenApiDto'
      responses:
        '200':
          description: An idempotent replay of an already accepted command.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SessionInteractionResponseOpenApiDto'
                  - $ref: '#/components/schemas/SessionEventRetryResponseOpenApiDto'
        '202':
          description:
            The command was accepted. Message and cancellation commands return durable interaction
            receipts; retry commands return a retrying event receipt. Execution progress is
            delivered separately by GET /events.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SessionInteractionResponseOpenApiDto'
                  - $ref: '#/components/schemas/SessionEventRetryResponseOpenApiDto'
        '400':
          description:
            The command envelope or command data is invalid, or an idle text Turn admission exceeds
            the combined Session-client and Hardware tool limit after model projection (64 tools or
            64 KiB; validation_failed). Admission saves no input or Turn on this overflow. New
            checkpoint retries are disabled by default and return checkpoint_runtime_unavailable
            when disabled or unavailable; previously accepted retry commands still recover their
            receipts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: An active End User principal is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description:
            The Session is unavailable or authorization-hidden, or a client_tool_output references
            an unknown, foreign or Hardware call (client_tool_call_unavailable).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description:
            The command identity was already used with a different body or target state, or a new
            message or retry targets a read-only Session (session_read_only).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description:
            New Turn admission is temporarily closed for deployment maintenance or recovery
            (turn_admission_closed), or the deployment lacks the Sandbox or Drive9 service a new
            Turn needs (service_configuration_unavailable; details.reason names it). This refusal
            happens before the command is saved, so the same clientEventId can be sent again once
            the service is set up. If the configuration changes after that check, the command is
            accepted instead and its Turn fails with the same code and reason in turn_error. A model
            the deployment does not configure keeps its 409 model_provider_unconfigured refusal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: turn_admission_closed
                  message: New Turns are temporarily unavailable
      security:
        - UserApiKey: []
      tags:
        - Sessions
      description: 'Authorization: UserApiKey; persisted credentials determine Organization and End User scope.'
