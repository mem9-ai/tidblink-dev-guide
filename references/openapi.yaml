      parameters:
        - name: tagValue
          required: false
          in: query
          schema:
            type: string
        - name: tagKey
          required: false
          in: query
          schema:
            type: string
        - name: limit
          required: false
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
          description: Maximum LLM rows and maximum sandbox rows to return.
        - name: userId
          required: false
          in: query
          schema:
            type: string
            pattern: ^[a-z0-9_-]{1,64}$
          description: Must be omitted or equal the acting user.
        - name: to
          required: false
          in: query
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
          description: Inclusive UTC end date (`YYYY-MM-DD`).
        - name: from
          required: false
          in: query
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
          description: Inclusive UTC start date (`YYYY-MM-DD`).
        - name: period
          required: false
          in: query
          description: Default range selector. `day` defaults to today; `week` defaults to the last 7 days.
          schema:
            enum:
              - day
              - week
            type: string
        - name: scope
          required: false
          in: query
          description: Detail rows are available only for the acting user.
          schema:
            enum:
              - user
            type: string
      responses:
        '200':
          description: Display-safe billing detail rows for the acting user only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleBillingDetailsResponseOpenApiDto'
        default:
          $ref: '#/components/responses/Error'
      security:
        - UserApiKey: []
      tags:
        - Console
      description: 'Authorization: UserApiKey; persisted credentials determine Organization and End User scope.'
