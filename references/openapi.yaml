    ClarificationItem:
      description: A structured blocking question and its optional canonical persisted response. The
        linked user Message remains the readable conversation projection.
      discriminator:
        propertyName: selectionMode
      oneOf:
        - type: object
          required:
            - prompt
            - selectionMode
            - answerChoices
          properties:
            prompt:
              type: string
            selectionMode:
              type: string
              enum:
                - single
              description: Requires exactly one answer and two or three mutually exclusive candidates.
            answerChoices:
              type: array
              minItems: 2
              maxItems: 3
              description: Candidate display order is also the canonical structured-answer order.
              items:
                type: string
                minLength: 1
            response:
              type: object
              required:
                - answers
                - responseTurnId
              properties:
                answers:
                  type: array
                  minItems: 1
                  maxItems: 1
                  description: The single structured answer.
                  items:
                    type: string
                    minLength: 1
                responseTurnId:
                  type: string
        - type: object
          required:
            - prompt
            - selectionMode
            - answerChoices
          properties:
            prompt:
              type: string
            selectionMode:
              type: string
              enum:
                - multiple
              description:
                Accepts a non-empty selection containing candidate values and/or at most one
                user-supplied value, with two through eight compatible candidates.
            answerChoices:
              type: array
              minItems: 2
              maxItems: 8
              description: Candidate display order is also the canonical structured-answer order.
              items:
                type: string
                minLength: 1
            response:
              type: object
              required:
                - answers
                - responseTurnId
              properties:
                answers:
                  type: array
                  minItems: 1
                  maxItems: 9
                  description:
                    Distinct structured values in candidate display order, followed by at most one
                    user-supplied answer.
                  items:
                    type: string
                    minLength: 1
                responseTurnId:
                  type: string
    TurnFailure:
      type: object
      description:
        A failed Turn's public error, as carried by its turn_error event and Turn.failure. The
        message is fixed text for the code and never contains supplier or internal error text.
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: service_configuration_unavailable (details.reason names the missing service),
            model_provider_failed (details.provider carries bounded supplier facts), runtime_error,
            interrupted, or another stable failure code.
        message:
          type: string
        details:
          type: object
          properties:
            reason:
              description:
                Present only with code service_configuration_unavailable, when the Turn failed because
                the deployment or Organization lacks a service it needs. The reason and message
                match the service_configuration_unavailable error response.
              type: string
              enum:
                - model_provider_unconfigured
                - sandbox_unconfigured
                - drive9_unconfigured
                - drive9_disabled_for_organization
            provider:
              description:
                Present only with code model_provider_failed. The failure category, the HTTP status the
                supplier returned and the supplier's own error type and code, each null when
                unknown. A supplier redirect is never followed and reads as supplier_error with the
                3xx status and errorType redirect. Never supplier message text, request paths or
                credentials.
              type: object
              required:
                - category
                - httpStatus
                - errorType
                - errorCode
              properties:
                category:
                  type: string
                  enum:
                    - authentication
                    - supplier_error
                    - supplier_unavailable
                    - network
                    - provider_stream_error
                httpStatus:
                  type: integer
                  nullable: true
                errorType:
                  type: string
                  nullable: true
                errorCode:
                  type: string
                  nullable: true
    Turn:
      type: object
      required:
        - id
        - sessionId
        - status
        - userMessage
        - userMessages
        - operations
        - assistantMessage
        - createdAt
        - billingTag
      properties:
        id:
          type: string
        sessionId:
          type: string
        status:
          type: string
          enum:
            - running
            - succeeded
            - failed
            - interrupted
        userMessage:
          $ref: '#/components/schemas/Message'
        userMessages:
          type: array
          description:
            Canonical admitted user Messages in input order; includes accepted inputs interrupted
            before incorporation.
          items:
            $ref: '#/components/schemas/Message'
        userFiles:
          type: array
          items:
            $ref: '#/components/schemas/TurnUserFile'
        operations:
          description:
            Operations performed by the Turn. drive.commit is recorded only after a workspace tool
            attempt.
          type: array
          items:
            $ref: '#/components/schemas/Operation'
        assistantMessage:
          allOf:
            - $ref: '#/components/schemas/Message'
          nullable: true
        clarificationItem:
          $ref: '#/components/schemas/ClarificationItem'
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        sourceFireId:
          type: string
          nullable: true
        billingTag:
          nullable: true
          description:
            One immutable Billing Tag snapshot for this resource. Null means untagged; request
            fields may be omitted only where the operation documents inheritance.
          allOf:
            - $ref: '#/components/schemas/BillingTag'
        failure:
          description:
            Present only on a failed Turn that saved a turn_error event; identical to that event's
            payload. Older failed Turns without one omit it.
          allOf:
            - $ref: '#/components/schemas/TurnFailure'
        executor:
          type: string
          enum:
            - full_agent
            - realtime_model
        realtime:
          type: object
          properties:
            connectionId:
              type: string
            linkedTurnIds:
              type: array
              items:
                type: string
          required:
            - connectionId
            - linkedTurnIds
        realtimeResponses:
          description: Narration-only Realtime responses about this Full Agent Turn, in Session sequence order.
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              sessionId:
                type: string
              turnId:
                type: string
              role:
                type: string
                enum:
                  - user
                  - assistant
              content:
                type: string
              createdAt:
                type: string
              inputContext:
                description:
                  Server-recorded channel of a user input; clients cannot set it. Present on user
                  Messages except Scheduler-triggered Turns and Messages saved before it existed;
                  absent on assistant Messages. Tolerate channel values added later.
                oneOf:
                  - type: object
                    properties:
                      channel:
                        type: string
                        enum:
                          - text
                    required:
                      - channel
                  - type: object
                    properties:
                      channel:
                        type: string
                        enum:
                          - audio
                      utterance:
                        description:
                          Transcript of the user's own speech when the Message content is a task delegated from
                          it.
                        type: string
                        minLength: 1
                        maxLength: 8000
                      emotion:
                        description: Emotion the Realtime model perceived in the speech; not a verified fact.
                        type: object
                        properties:
                          label:
                            type: string
                            minLength: 1
                            maxLength: 64
                          confidence:
                            type: number
                            minimum: 0
                            exclusiveMinimum: false
                            maximum: 1
                            exclusiveMaximum: false
                          source:
                            type: string
                            enum:
                              - realtime_model
                        required:
                          - label
                          - confidence
                          - source
                      realtimeSummary:
                        description:
                          The Realtime model's own summary of the preceding voice conversation; model-written,
                          not a durable transcript. Interim field, removed once the server derives
                          this context.
                        type: string
                        minLength: 1
                        maxLength: 8000
                    required:
                      - channel
                  - description:
                      "A Realtime Standing Task cycle: the platform started this Turn with the Template's
                      standing goal while a Realtime Connection was live; nobody typed or spoke it."
                    type: object
                    properties:
                      channel:
                        type: string
                        enum:
                          - standing_task
                    required:
                      - channel
              realtime:
                oneOf:
                  - type: object
                    properties:
                      startsTurn:
                        type: boolean
                      linkedTurnId:
                        type: string
                        nullable: true
                    required:
                      - startsTurn
                      - linkedTurnId
                  - type: object
                    properties:
                      kind:
                        type: string
                        enum:
                          - chat
                          - task_ack
                          - task_progress
                          - task_result
                          - clarify
                          - device_ack
                      interrupted:
                        description: The reply was interrupted; its transcript may include speech the user did not hear.
                        type: boolean
                      responseId:
                        type: string
                        nullable: true
                      linkedTurnId:
                        type: string
                        nullable: true
                    required:
                      - kind
                      - interrupted
                      - responseId
                      - linkedTurnId
            required:
              - id
              - sessionId
              - turnId
              - role
              - content
              - createdAt
    TurnResponse:
      type: object
      required:
        - turn
      properties:
        turn:
          $ref: '#/components/schemas/Turn'
