                        input nor output carries the model supplier's tool-call id; use the
                        Operation id to identify a tool call and its result.
                    output:
                      description:
                        'Kind-specific result. Hardware Client Tool Operations omit output in every status. An
                        llm.complete Operation exposes usage as token counts only: input, output,
                        cacheRead, cacheWrite, totalTokens, and optional cacheWrite1h and reasoning.
                        Counts that are unavailable or invalid are omitted; absent usage is omitted.
                        Supplier SDK cost is not exposed. Customer fees are available from the
                        Billing usage APIs. A failed or interrupted llm.complete Operation has error
                        {code, message, details?} with fixed text only; model_provider_failed
                        carries details.provider (category, httpStatus, errorType, errorCode); other
                        failures use runtime_error or a ledger outcome code. Any other failed,
                        interrupted or unknown_result Operation with an error, including tool
                        Operations, has error {code, message, details} with fixed text naming only
                        the tool: an intentional tool code (for example mcp_unavailable or
                        validation_error) is kept; an allow-listed web_search_* or session_recall_*
                        reason becomes the code and is repeated as details.code with a boolean
                        details.retryable; anything else reads tool_failed. A memory.recall
                        Operation keeps only memory_recall_failed, turn_interrupted or
                        operation_result_unknown, and otherwise reads tool_failed. details also
                        carries tool, category (rejected, unavailable, remote_error, failed,
                        unknown_result, interrupted or unexpected) and, when known, dispatch and
                        retryContract.'
