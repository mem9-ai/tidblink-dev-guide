        Retrying the same ZIP with the same Idempotency-Key and Organization Key returns the
        original upload and its current state, including when requests overlap. A terminal upload is
        not restarted. Different ZIP bytes with the same key return 409.


        Authorization: OrganizationApiKey; persisted credentials determine Organization scope; no
        End User scope. Uploads and publication are attributed to the authentic Organization API
        Key.
      operationId: createOrganizationSkillUpload
      parameters:
        - name: Content-Length
          in: header
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              maxLength: 209715200
      responses:
        '202':
          description: Upload accepted for asynchronous validation.
          content:
            application/json:
              schema:
                type: object
                required:
                  - upload
                properties:
                  upload:
                    type: object
                    required:
                      - uploadId
                      - skillId
                      - state
                      - byteSize
                      - sha256
                      - expiresAt
                      - validation
                      - version
                      - createdAt
                      - updatedAt
                    properties:
                      uploadId:
                        type: string
                      skillId:
                        type: string
                      state:
                        type: string
                        enum:
                          - uploading
                          - pending
                          - uploaded
                          - fetching
                          - validating
                          - extracting
                          - awaiting_confirmation
                          - finalizing
                          - done
                          - failed
                          - aborted
                      byteSize:
                        type: integer
                        minimum: 0
                      sha256:
                        type: string
                        pattern: ^[0-9a-f]{64}$
                      expiresAt:
                        type: string
                        format: date-time
                        nullable: true
                      validation:
                        type: object
                        required:
                          - entriesTotal
                          - fileCount
                          - entriesDone
                          - declaredBytes
                          - bytesDone
                          - diagnostics
                          - failureCode
                          - failurePath
                        properties:
                          entriesTotal:
                            type: integer
                            minimum: 0
                            nullable: true
                          fileCount:
                            type: integer
                            minimum: 0
                            nullable: true
                          entriesDone:
                            type: integer
                            minimum: 0
                          declaredBytes:
                            type: integer
                            minimum: 0
                            nullable: true
                          bytesDone:
                            type: integer
                            minimum: 0
                          diagnostics:
                            type: array
                            items:
                              type: object
                          failureCode:
                            type: string
                            nullable: true
                          failurePath:
                            type: string
                            nullable: true
                        additionalProperties: false
                      version:
                        type: integer
                        minimum: 1
                        nullable: true
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
                    additionalProperties: false
                additionalProperties: false
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
        '400':
          description: The ZIP body, Content-Length or Idempotency-Key is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
